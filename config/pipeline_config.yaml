# ============================================================
# pipeline_config.yaml
# Configuração de infraestrutura da pipeline (R1).
# As coleções a processar ficam em collections.json, não aqui.
# Nenhuma credencial fica aqui — segredos vêm do Databricks
# Secret Scope "conn-db" (ver notebooks/create-secret.py).
# ============================================================

pipeline:
  # ------------------------------------------------------------
  # Unity Catalog — nomes lógicos. Catalog, schemas e volumes são
  # criados automaticamente pelos notebooks (CREATE ... IF NOT
  # EXISTS), então isso roda em qualquer workspace Databricks com
  # Unity Catalog habilitado, sem setup manual prévio.
  # ------------------------------------------------------------
  catalog: "main"

  landing_schema: "landing_mflix"
  bronze_schema: "bronze_mflix"
  checkpoints_schema: "checkpoints_mflix"
  schemas_schema: "schemas_mflix"

  # Mesmo nome de volume dentro de cada schema (landing/checkpoints/schemas)
  volume_name: "raw"

  # ------------------------------------------------------------
  # R2 — leitura paginada / lotes
  # ------------------------------------------------------------
  batch_size: 5000
  max_retries: 3

  # R2 — controle de paralelismo / anti small-files na escrita da Bronze
  bronze_output_partitions: 4

  # ------------------------------------------------------------
  # Schema drift (R7)
  # ------------------------------------------------------------
  infer_column_types: true
  schema_evolution_mode: "rescue"   # campos novos vão para _rescued_data
  available_now: true

  # ------------------------------------------------------------
  # R8 — limiar de divergência (origem x destino) para reconciliação.
  # Acima disso, a execução é marcada como PARTIAL/FAILED em vez de SUCCESS.
  # ------------------------------------------------------------
  reconciliation_threshold_pct: 0.5